# Local SonarQube (P0) settings. Run: sonar-scanner -Dproject.settings=.sonar/local.properties
# Host URL and token come from SONAR_HOST_URL / SONAR_TOKEN env, never from this file.
# Built-in Sonar way profile only: python:S3776 is NOT excluded here (the SonarQube Cloud exclusion is not carried over).
sonar.projectKey=local:oig-proxy
sonar.projectName=local:oig-proxy
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Source/test split: files matching sonar.test.inclusions are tests (tests/ and the testing/ mock+replay harness), rest is main code.
sonar.sources=.
sonar.tests=tests,testing,addon/oig-proxy/tests
sonar.test.inclusions=tests/**,testing/**,addon/oig-proxy/tests/**

# Exclusions: ONLY generated / vendored / bundled / fixture / data paths.
# vendored: .opencode/docs holds downloaded third-party web pages / papers (markdown, one has binary data)
# data: recorded BOX frame captures and probe frames under testing/test_data (includes the small helper script extract_frames.py, excluded on purpose with its data)
# fixture: tests/fixtures holds JSON fixtures plus the tiny dummy.py test helper (DummyWriter), excluded on purpose with the fixtures
sonar.exclusions=.opencode/docs/**,testing/test_data/**,testing/*.json,testing/*.xml,tests/fixtures/**
# same data/fixture paths for the test scope (sonar.exclusions does not apply to test files)
sonar.test.exclusions=testing/test_data/**,testing/*.json,testing/*.xml,tests/fixtures/**
