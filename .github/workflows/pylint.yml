name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run blocking Pylint
        env:
          PYTHONPATH: addon/oig-proxy
        run: |
          mkdir -p reports
          python -m pylint addon/oig-proxy tests/v2 \
            --output-format=json > reports/pylint.json
      - name: Require Pylint evidence
        if: always()
        run: test -f reports/pylint.json
      - name: Upload Pylint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-evidence
          if-no-files-found: error
          path: reports/pylint.json
