name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          go install github.com/gitleaks/gitleaks/v8@v8.24.2
      - name: Run blocking security gates
        env:
          PYTHON_BIN: python
          SEMGREP_BIN: semgrep
          REPORT_DIR: ${{ github.workspace }}/reports
        run: .github/scripts/run_security.sh
      - name: Require scanner evidence
        if: always()
        run: |
          test -f reports/bandit.json
          test -f reports/semgrep.json
          test -f reports/gitleaks.json
          test -f reports/safety.json
          test -s docs/superpowers/reports/2026-08-06-local-setting-transaction-hardening-owasp.md
      - name: Upload scanner and OWASP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          if-no-files-found: error
          path: |
            reports/bandit.json
            reports/semgrep.json
            reports/gitleaks.json
            reports/safety.json
            docs/superpowers/reports/2026-08-06-local-setting-transaction-hardening-owasp.md
