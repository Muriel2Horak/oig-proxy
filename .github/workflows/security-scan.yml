name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Create reports directory
        if: success() || failure()
        run: mkdir -p reports

      - name: Install Gitleaks
        if: success() || failure()
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Install Trivy
        if: success() || failure()
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
          echo "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75  $RUNNER_TEMP/trivy.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy

      - name: Run Gitleaks (Secret leak detection)
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts=HEAD \
            --redact=100 --report-format=json --report-path=reports/gitleaks.json --exit-code=1 .

      - name: Run Bandit (Python SAST)
        if: success() || failure()
        run: |
          python -m bandit -r addon/oig-proxy -x addon/oig-proxy/tests -f json \
            | jq 'del(.results[]?.code)' > reports/bandit.json

      - name: Resolve runtime dependencies for security scans
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/oig-runtime-scan"
          python -m pip install --dry-run --ignore-installed \
            --report "$RUNNER_TEMP/oig-runtime-resolution.json" \
            -r addon/oig-proxy/requirements.txt
          jq -er '.install[].metadata | "\(.name)==\(.version)"' \
            "$RUNNER_TEMP/oig-runtime-resolution.json" > "$RUNNER_TEMP/oig-runtime-scan/requirements.txt"

      - name: Run Safety (Dependency vulnerabilities)
        if: success() || failure()
        run: |
          python -m safety --disable-optional-telemetry check \
            -r "$RUNNER_TEMP/oig-runtime-scan/requirements.txt" \
            --output json --save-json reports/safety.json --exit-code >/dev/null

      - name: Run Semgrep (Advanced SAST)
        if: success() || failure()
        run: |
          semgrep scan --config=p/default --metrics=off --disable-version-check --error --json addon/oig-proxy \
            | jq '{version, results: [.results[] | {check_id, path, start, end, severity: .extra.severity}],
              errors: [.errors[] | {type, level, path}]}' > reports/semgrep.json
          jq -e '.errors | length == 0' reports/semgrep.json >/dev/null

      - name: Run Trivy (Dependency vulnerabilities)
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln --exit-code 1 --format json \
            --output reports/trivy.json "$RUNNER_TEMP/oig-runtime-scan"
          jq -e 'any(.Results[]?; .Type == "pip")' reports/trivy.json >/dev/null

      - name: Record runtime dependency licenses
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners license --format json \
            --output reports/trivy-licenses.json "$RUNNER_TEMP/oig-runtime-scan"

      # Legacy V1 security/penetration tests removed - they depended on old V1 module names
      # and are not part of current V2 release scope
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json
      
      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: reports/safety.json
      
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: reports/semgrep.json
      
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: |
            reports/trivy.json
            reports/trivy-licenses.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
      
