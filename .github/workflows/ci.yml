name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Unit, integration, E2E, and exclusive coverage gates
        env:
          PYTHON_BIN: python
          REPORT_DIR: ${{ github.workspace }}/reports
        run: .github/scripts/run_tests.sh
      - name: Type checking
        env:
          PYTHONPATH: addon/oig-proxy
        run: |
          set -euo pipefail
          init_path=addon/oig-proxy/__init__.py
          backup_path="${init_path}.mypy-backup"
          restore_init() {
            if [[ -f "${backup_path}" ]]; then
              mv "${backup_path}" "${init_path}"
            fi
          }
          trap restore_init EXIT
          mv "${init_path}" "${backup_path}"
          MYPYPATH=addon/oig-proxy python -m mypy addon/oig-proxy --ignore-missing-imports
          restore_init
          trap - EXIT
      - name: Flake8
        run: python -m flake8 addon/oig-proxy tests/v2
      - name: Require test evidence
        if: always()
        run: |
          test -s reports/junit.xml
          test -s reports/coverage.xml
          test -s reports/coverage-gate.json
          test -s reports/egress-guard.json
          test -s docs/superpowers/reports/2026-08-06-local-setting-transaction-hardening-traceability.md
          test -s docs/superpowers/reports/2026-08-06-local-setting-transaction-hardening-owasp.md
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-evidence
          if-no-files-found: error
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/coverage-gate.json
            reports/egress-guard.json
            docs/superpowers/reports/2026-08-06-local-setting-transaction-hardening-traceability.md
            docs/superpowers/reports/2026-08-06-local-setting-transaction-hardening-owasp.md

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: addon/oig-proxy/Dockerfile
          ignore: DL3006,DL3018
