name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Changed-functions quality check
        if: github.event_name == 'pull_request'
        run: python scripts/quality/changed-functions-check --base ${{ github.event.pull_request.base.sha }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: addon/oig-proxy
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=addon/oig-proxy --cov-branch \
            --cov-report=xml:reports/coverage.xml --cov-report=json:reports/coverage.json
      - name: Enforce runtime statement coverage above 80%
        run: |
          jq -e '.totals | (.num_statements > 0) and
            (.covered_lines * 100 > .num_statements * 80)' reports/coverage.json
      - name: Type checking (mypy)
        env:
          PYTHONPATH: addon/oig-proxy
          MYPYPATH: addon/oig-proxy
        run: mypy --explicit-package-bases addon/oig-proxy --ignore-missing-imports
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: addon/oig-proxy/Dockerfile
          ignore: DL3006,DL3018
      - name: Security scan (bandit)
        run: |
          mkdir -p reports
          bandit -r addon/oig-proxy -x addon/oig-proxy/tests -f json -o reports/bandit.json

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
