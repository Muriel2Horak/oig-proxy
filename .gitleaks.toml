title = "OIG Proxy secret detection"

[[rules]]
id = "generic-api-key"
description = "Generic API key assignment"
regex = '''(?i)(api_key|apikey|api-key)['"\s]*[:=]['"\s]*[a-zA-Z0-9\-_]{10,}'''
entropy = 3.7
tags = ["api", "key"]

[[rules]]
id = "aws-access-key"
description = "AWS access key"
regex = '''(AKIA|A3T[A-Z0-9]|ABIA|ACCA)[A-Z0-9]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "github-token"
description = "GitHub token"
regex = '''gh[pousr]_[a-zA-Z0-9]{36,255}'''
tags = ["github", "token"]

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''xox[baprs]-[a-zA-Z0-9-]{10,48}'''
tags = ["slack", "token"]

[[rules]]
id = "private-key"
description = "Private key"
regex = '''-----BEGIN\s*(RSA|EC|DSA|OPENSSH)?\s*PRIVATE\s*KEY-----'''
tags = ["private-key"]

[[rules]]
id = "bearer-token"
description = "Bearer token"
regex = '''Bearer\s+[a-zA-Z0-9\-_.]{20,}'''
tags = ["bearer", "token"]

[allowlist]
description = "Generated, cache, tool, and known binary exclusions only"
commits = [
  "ed8aae1d43d6bee140b22494561c691573009c6a",
]
paths = [
  '''^\.gitleaks\.toml$''',
  '''^\.git/''',
  '''^\.venv/''',
  '''^\.mypy_cache/''',
  '''^\.pytest_cache/''',
  '''^\.ruff_cache/''',
  '''^\.sonar_cache/''',
  '''^__pycache__/''',
  '''/__pycache__/''',
  '''^node_modules/''',
  '''^reports/''',
  '''^output/''',
  '''\.coverage(?:\..*)?$''',
  '''\.(?:db|sqlite|sqlite3|pcap|png|jpg|jpeg|gif|webp|pdf|zip|gz|tar)$''',
]
