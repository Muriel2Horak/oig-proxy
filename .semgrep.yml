rules:
  - id: sqlite-fstring-query
    patterns:
      - pattern: $DB.$METHOD(f"...", ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(execute|executemany)$
    message: SQLite queries must be static parameterized literals, not f-strings.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-89", owasp: "A03:2021 Injection"}

  - id: sqlite-percent-query
    patterns:
      - pattern: $DB.$METHOD($QUERY % $VALUE, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(execute|executemany)$
    message: SQLite queries must not use percent interpolation.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-89", owasp: "A03:2021 Injection"}

  - id: sqlite-concatenated-query
    patterns:
      - pattern: $DB.$METHOD($LEFT + $RIGHT, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(execute|executemany)$
    message: SQLite queries must not use string concatenation.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-89", owasp: "A03:2021 Injection"}

  - id: sqlite-formatted-query
    patterns:
      - pattern: $DB.$METHOD($QUERY.format(...), ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(execute|executemany)$
    message: SQLite queries must not use str.format interpolation.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-89", owasp: "A03:2021 Injection"}

  - id: dynamic-eval
    pattern: eval(...)
    message: Dynamic eval is prohibited in production.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-95", owasp: "A03:2021 Injection"}

  - id: dynamic-exec
    pattern: exec(...)
    message: Dynamic exec is prohibited in production.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-95", owasp: "A03:2021 Injection"}

  - id: unsafe-pickle-loads
    pattern: pickle.loads(...)
    message: Untrusted pickle deserialization is prohibited.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-502", owasp: "A08:2021 Software and Data Integrity Failures"}

  - id: unsafe-tempfile-mktemp
    pattern: tempfile.mktemp(...)
    message: Use a securely created temporary file or directory.
    severity: ERROR
    languages: [python]
    metadata: {cwe: "CWE-377", owasp: "A01:2021 Broken Access Control"}
